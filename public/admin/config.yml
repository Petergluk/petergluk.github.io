backend:
  name: github
  repo: petergluk/petergluk.github.io
  branch: main

# Allow saving images directly to the public/images folder
media_folder: "public/images"
public_folder: "/images"

# Configure the UI language
locale: "ru"

collections:
  - name: "home"
    label: "Главная страница (Конфиг: фото, шрифт, текст)"
    files:
      - label: "Настройки главной страницы"
        name: "home"
        file: "src/data/pages/home.json"
        fields:
          - { label: "Размер фото (ширина в px, по умолч. 285)", name: "portrait_size", widget: "number", value_type: "int", default: 285, min: 180, max: 600, step: 5, required: false }
          - { label: "Размер шрифта текста (rem, по умолч. 2.35)", name: "font_size", widget: "number", value_type: "float", default: 2.35, min: 1.2, max: 4.0, step: 0.05, required: false }
          - { label: "Межстрочный интервал (line-height, по умолч. 1.3)", name: "line_height", widget: "number", value_type: "float", default: 1.3, min: 1.0, max: 2.5, step: 0.05, required: false }
          - { label: "Портрет (фото)", name: "portrait", widget: "image" }
          - { label: "Текст на главной странице", name: "intro_text", widget: "markdown", buttons: ["bold", "italic", "link"] }
          - { label: "Заголовок окна (Title)", name: "title", widget: "string" }
          - { label: "Описание для SEO", name: "description", widget: "string" }

  - name: "texts"
    label: "Тексты (Статьи)"
    folder: "src/pages/texts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "../../layouts/TextLayout.astro" }
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Описание (анонс)", name: "description", widget: "text", required: false }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Обложка (Картинка)", name: "image", widget: "image", required: false }
      - label: "Теги"
        name: "tags"
        widget: "list"
        required: false
      - { label: "Текст", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Остальные страницы (Контакты, Сессии, и др.)"
    files:

      - label: "Контакты"
        name: "contacts"
        file: "src/data/pages/contacts.json"
        fields:
          - { label: "Заголовок окна (Title)", name: "title", widget: "string" }
          - { label: "Описание для SEO", name: "description", widget: "string" }
          - label: "Hero блок"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Надзаголовок (Eyebrow)", name: "eyebrow", widget: "string" }
              - { label: "Главный заголовок", name: "title", widget: "string" }
              - { label: "Текст", name: "lede", widget: "text" }
          - label: "Кнопка Telegram"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Текст кнопки", name: "text", widget: "string" }
              - { label: "Ссылка", name: "url", widget: "string" }
          - label: "Социальные сети"
            name: "links"
            widget: "list"
            fields:
              - { label: "Название (Например, Telegram)", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Тег (кнопка)", name: "tag", widget: "string" }
              - { label: "Описание", name: "muted", widget: "string" }

      - label: "Индивидуальные сессии"
        name: "sessions"
        file: "src/data/pages/sessions.json"
        fields:
          - { label: "Заголовок окна (Title)", name: "title", widget: "string" }
          - { label: "Описание для SEO", name: "description", widget: "string" }
          - label: "Hero блок"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Надзаголовок (Eyebrow)", name: "eyebrow", widget: "string" }
              - { label: "Главный заголовок", name: "title", widget: "string" }
              - { label: "Текст", name: "lede", widget: "text" }
          - label: "Форматы и стоимость"
            name: "formats"
            widget: "list"
            fields:
              - { label: "Заголовок формата", name: "title", widget: "string" }
              - { label: "Цена", name: "price", widget: "string" }
              - { label: "Тег", name: "tag", widget: "string" }
              - { label: "Абзацы текста", name: "body", widget: "list", field: {label: "Абзац", name: "paragraph", widget: "string"} }
          - label: "Принципы работы"
            name: "principles"
            widget: "list"
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Текст", name: "text", widget: "text" }

      - label: "Категории и классы"
        name: "categories"
        file: "src/data/categories.json"
        fields:
          - label: "Категории направлений"
            name: "categories"
            widget: "list"
            fields:
              - { label: "URL (id)", name: "id", widget: "string" }
              - { label: "Название направления", name: "title", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "string" }
              - { label: "Описание", name: "description", widget: "text" }
              - label: "Мастер-классы внутри направления"
                name: "classes"
                widget: "list"
                fields:
                  - { label: "URL (id)", name: "id", widget: "string" }
                  - { label: "Название класса", name: "title", widget: "string" }
                  - { label: "Короткое описание (анонс)", name: "description", widget: "markdown" }
                  - { label: "Полный текст", name: "content", widget: "markdown" }
  - name: "landings"
    label: "Лендинги (Конструктор)"
    folder: "src/data/landings"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Заголовок страницы (Title)", name: "title", widget: "string" }
      - { label: "Описание для SEO", name: "description", widget: "string", required: false }
      - label: "Блоки страницы"
        name: "blocks"
        widget: "list"
        types:
          - label: "Обложка (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Надзаголовок", name: "eyebrow", widget: "string", required: false }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Текст", name: "lede", widget: "text", required: false }
          - label: "Текстовый блок"
            name: "text_block"
            widget: "object"
            fields:
              - { label: "Текст", name: "content", widget: "markdown" }
              - { label: "Серый фон?", name: "warm_bg", widget: "boolean", default: false, required: false }
          - label: "Сетка карточек"
            name: "grid"
            widget: "object"
            fields:
              - { label: "Надзаголовок", name: "eyebrow", widget: "string", required: false }
              - { label: "Заголовок блока", name: "title", widget: "string", required: false }
              - { label: "Текст-введение", name: "description", widget: "text", required: false }
              - { label: "Количество колонок", name: "columns", widget: "select", options: ["2", "3", "4", "auto"], default: "3" }
              - { label: "Серый фон?", name: "warm_bg", widget: "boolean", default: false, required: false }
              - label: "Карточки"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Картинка", name: "image", widget: "image", required: false }
                  - { label: "Заголовок", name: "title", widget: "string" }
                  - { label: "Текст", name: "text", widget: "text", required: false }
                  - { label: "Надпись на ссылке (если нужна)", name: "link_label", widget: "string", required: false }
                  - { label: "URL ссылки", name: "url", widget: "string", required: false }
          - label: "Призыв к действию (Кнопки)"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Надзаголовок", name: "eyebrow", widget: "string", required: false }
              - { label: "Заголовок блока", name: "title", widget: "string", required: false }
              - { label: "Текст", name: "description", widget: "text", required: false }
              - { label: "Выравнивание по центру?", name: "center", widget: "boolean", default: true, required: false }
              - { label: "Серый фон?", name: "warm_bg", widget: "boolean", default: false, required: false }
              - label: "Кнопки"
                name: "buttons"
                widget: "list"
                fields:
                  - { label: "Текст", name: "text", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Вторичный стиль?", name: "secondary", widget: "boolean", default: false, required: false }
          - label: "Текст с картинкой"
            name: "image_text"
            widget: "object"
            fields:
              - { label: "Надзаголовок", name: "eyebrow", widget: "string", required: false }
              - { label: "Заголовок блока", name: "title", widget: "string", required: false }
              - { label: "Текст", name: "content", widget: "markdown" }
              - { label: "Картинка", name: "image", widget: "image", required: false }
              - { label: "Картинка справа?", name: "image_right", widget: "boolean", default: true, required: false }
              - { label: "Серый фон?", name: "warm_bg", widget: "boolean", default: false, required: false }
          - label: "Аккордеон (FAQ / Программа)"
            name: "accordion"
            widget: "object"
            fields:
              - { label: "Надзаголовок", name: "eyebrow", widget: "string", required: false }
              - { label: "Заголовок блока", name: "title", widget: "string", required: false }
              - { label: "Серый фон?", name: "warm_bg", widget: "boolean", default: false, required: false }
              - label: "Пункты (Вопрос - Ответ)"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Заголовок (Вопрос)", name: "title", widget: "string" }
                  - { label: "Текст (Ответ)", name: "content", widget: "markdown" }
          - label: "Отзывы"
            name: "reviews"
            widget: "object"
            fields:
              - { label: "Надзаголовок", name: "eyebrow", widget: "string", required: false }
              - { label: "Заголовок блока", name: "title", widget: "string", required: false }
              - { label: "Серый фон?", name: "warm_bg", widget: "boolean", default: false, required: false }
              - label: "Отзывы"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Автор", name: "author", widget: "string" }
                  - { label: "Регалии", name: "subtitle", widget: "string", required: false }
                  - { label: "Текст отзыва", name: "text", widget: "text" }
          - label: "Видео"
            name: "video"
            widget: "object"
            fields:
              - { label: "Надзаголовок", name: "eyebrow", widget: "string", required: false }
              - { label: "Заголовок блока", name: "title", widget: "string", required: false }
              - { label: "URL видео (YouTube/Vimeo)", name: "url", widget: "string" }
              - { label: "Серый фон?", name: "warm_bg", widget: "boolean", default: false, required: false }
          - label: "Вставка кода (HTML/Форма)"
            name: "html"
            widget: "object"
            fields:
              - { label: "Надзаголовок", name: "eyebrow", widget: "string", required: false }
              - { label: "Заголовок блока", name: "title", widget: "string", required: false }
              - { label: "HTML Код", name: "code", widget: "code", required: false }
              - { label: "Серый фон?", name: "warm_bg", widget: "boolean", default: false, required: false }
